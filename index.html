<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --gold:#c9a84c;--bg0:#0d0d0d;--bg1:#141414;--bg2:#1a1a1a;--bg3:#202020;
    --bdr:rgba(201,168,76,.18);--bdr2:rgba(201,168,76,.44);
    --tx0:#e8e0cc;--tx1:#9a9080;--tx2:#5a5040;
    --rd:#2e7d32;--rdg:#c07820;--r:5px
  }
  @media(prefers-color-scheme:light){:root{
    --bg0:#f4efe5;--bg1:#ece5d5;--bg2:#faf6ee;--bg3:#f0e8d8;
    --bdr:rgba(100,70,10,.14);--bdr2:rgba(100,70,10,.36);
    --tx0:#1a1208;--tx1:#6b5530;--tx2:#a08060;
    --rd:#1b5e20;--rdg:#7a4a00;--gold:#7a5010
  }}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg0);color:var(--tx0);min-height:100vh}

  /* ── Header ── */
  .hdr{background:var(--bg1);border-bottom:1px solid var(--bdr2);padding:13px 15px 11px;position:sticky;top:0;z-index:100}
  .htop{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .atit{font-family:Georgia,serif;font-size:15px;font-weight:700;color:var(--gold);letter-spacing:.05em}
  .asub{font-size:10px;color:var(--tx2);letter-spacing:.1em;text-transform:uppercase}
  .prow{display:flex;justify-content:space-between;margin-bottom:4px}
  .plbl{font-size:10px;color:var(--tx1);letter-spacing:.08em;text-transform:uppercase}
  .pnum{font-size:11px;color:var(--tx1)}.pnum strong{color:var(--gold)}
  .pbg{height:5px;background:var(--bg2);border-radius:3px;overflow:hidden;border:1px solid var(--bdr)}
  .pf{height:100%;background:linear-gradient(90deg,#2e7d32,#4caf50);border-radius:3px;transition:width .4s}
  .mst{display:flex;gap:12px;margin-top:6px}
  .ms{font-size:10px;display:flex;align-items:center;gap:4px;color:var(--tx1)}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .dr{background:#4caf50}.dg{background:#f0a030}.du{background:var(--tx2)}

  /* ── Tabs ── */
  .tabs{display:flex;overflow-x:auto;gap:3px;padding:9px 15px 0;background:var(--bg1);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{font-size:11px;padding:5px 10px;border-radius:5px 5px 0 0;background:none;border:1px solid transparent;border-bottom:none;color:var(--tx2);cursor:pointer;white-space:nowrap;font-family:inherit}
  .tab.on{background:var(--bg2);border-color:var(--bdr);color:var(--gold)}
  .tab:hover:not(.on){color:var(--tx1)}

  /* ── Filters ── */
  .flt{display:flex;gap:6px;flex-wrap:wrap;padding:9px 15px;background:var(--bg2);border-bottom:1px solid var(--bdr)}
  .fsel,.fsrch{font-size:11px;background:var(--bg1);color:var(--tx0);border:1px solid var(--bdr);border-radius:var(--r);padding:5px 8px;outline:none;font-family:inherit}
  .fsel{flex:1;min-width:120px;cursor:pointer}.fsrch{flex:2;min-width:150px}
  .fsrch::placeholder{color:var(--tx2)}.fsrch:focus,.fsel:focus{border-color:var(--gold)}
  .frst{font-size:10px;background:none;color:var(--tx2);border:1px solid var(--bdr);border-radius:var(--r);padding:5px 8px;cursor:pointer;font-family:inherit}
  .frst:hover{color:var(--gold);border-color:var(--bdr2)}

  /* ── Content ── */
  .ct{padding:13px 15px}
  .esec{margin-bottom:22px}
  .ehdr{display:flex;align-items:center;gap:8px;margin-bottom:11px;padding-bottom:7px;border-bottom:1px solid var(--bdr)}
  .etit{font-family:Georgia,serif;font-size:13px;font-weight:700;color:var(--gold);flex:1}
  .epb{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;width:48px;flex-shrink:0}
  .epf{height:100%;background:var(--gold)}
  .epct{font-size:10px;color:var(--tx2);min-width:24px;text-align:right}
  .ecnt{font-size:10px;color:var(--tx2);background:var(--bg3);border:1px solid var(--bdr);border-radius:10px;padding:1px 7px}

  /* ── Series ── */
  .sgrp{margin-bottom:12px}
  .stit{font-size:10px;font-weight:700;color:var(--tx1);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;padding-left:7px;border-left:2px solid var(--bdr2)}

  /* ── Book rows ── */
  .bks{display:flex;flex-direction:column;gap:2px}
  .bk{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--bg2);border-radius:var(--r);border:1px solid var(--bdr);cursor:pointer;transition:border-color .12s,background .12s;min-height:38px}
  .bk:hover{border-color:var(--bdr2);background:var(--bg3)}
  .bnum{font-size:9px;color:var(--tx2);min-width:22px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
  .sbtn{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--bdr2);background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .12s;padding:0}
  .sbtn:hover{transform:scale(1.2)}
  .sr .sbtn{background:var(--rd);border-color:var(--rd)}
  .sg .sbtn{background:var(--rdg);border-color:var(--rdg)}
  .btit{flex:1;font-size:12px;color:var(--tx0);line-height:1.3}
  .sr .btit{color:var(--tx1)}.sg .btit{font-weight:600}

  /* ── Badges ── */
  .badge{font-size:8px;letter-spacing:.05em;text-transform:uppercase;padding:2px 5px;border-radius:3px;flex-shrink:0;border:1px solid}
  .bn {background:rgba(30,60,120,.2);color:#7090e0;border-color:rgba(60,100,200,.25)}
  .ba {background:rgba(80,30,80,.2);color:#c070d0;border-color:rgba(140,50,140,.25)}
  .bv {background:rgba(20,80,60,.2);color:#50c090;border-color:rgba(30,120,90,.25)}
  .bad{background:rgba(140,90,10,.2);color:#d0a050;border-color:rgba(180,130,20,.25)}
  .bs {background:rgba(60,100,120,.2);color:#60b0d0;border-color:rgba(40,100,140,.25)}
  .bo {background:rgba(100,40,20,.2);color:#d07050;border-color:rgba(160,60,30,.25)}
  .bsg{background:rgba(180,30,30,.2);color:#e07070;border-color:rgba(200,40,40,.25)}
  @media(prefers-color-scheme:light){
    .bn {background:rgba(30,60,180,.07);color:#1840a0;border-color:rgba(30,60,180,.2)}
    .ba {background:rgba(100,20,120,.07);color:#701090;border-color:rgba(100,20,120,.2)}
    .bv {background:rgba(10,100,60,.07);color:#0a6040;border-color:rgba(10,100,60,.2)}
    .bad{background:rgba(140,90,10,.07);color:#7a5000;border-color:rgba(140,90,10,.2)}
    .bs {background:rgba(20,80,120,.07);color:#1a6090;border-color:rgba(20,80,120,.2)}
    .bo {background:rgba(140,50,20,.07);color:#903010;border-color:rgba(140,50,20,.2)}
    .bsg{background:rgba(180,20,20,.07);color:#a01010;border-color:rgba(180,20,20,.2)}
  }
  .sind{font-size:8px;letter-spacing:.04em;text-transform:uppercase;padding:2px 5px;border-radius:3px;flex-shrink:0;border:1px solid}
  .si-r{background:rgba(46,125,50,.15);color:#66bb6a;border-color:rgba(46,125,50,.3)}
  .si-g{background:rgba(192,120,32,.15);color:#ffa040;border-color:rgba(192,120,32,.3)}
  .empty{text-align:center;padding:32px;color:var(--tx2);font-size:13px}
</style>
</head>

const books=RAW.map((b,i)=>({...b,id:i}));

// ── State ──
let state={};
try{state=JSON.parse(localStorage.getItem('wh40k_v5')||'{}')}catch(e){}
let aEra='all',fSer='',fSt='',fQ='';

const gs=id=>state[id]||'unread';
function cycle(id){
  const s=gs(id),n=s==='unread'?'reading':s==='reading'?'read':'unread';
  state[id]=n;
  try{localStorage.setItem('wh40k_v5',JSON.stringify(state))}catch(e){}
  render();
}

function updateProg(){
  const tot=books.length,rd=books.filter(b=>gs(b.id)==='read').length,rg=books.filter(b=>gs(b.id)==='reading').length;
  const pct=tot?Math.round(rd/tot*100):0;
  document.getElementById('pn').innerHTML=`${rd} of <strong>${tot}</strong> (${pct}%)`;
  document.getElementById('pb').style.width=pct+'%';
  document.getElementById('cr').textContent=rd+' read';
  document.getElementById('cg').textContent=rg+' reading';
  document.getElementById('cu').textContent=(tot-rd-rg)+' unread';
}

function buildTabs(){
  document.getElementById('tabs').innerHTML=[{id:'all',short:'All Eras'},...ERAS].map(e=>`<button class="tab ${e.id===aEra?'on':''}" onclick="setEra('${e.id}')">${e.short}</button>`).join('');
}

function popSeries(){
  const sel=document.getElementById('fsr'),cur=sel.value;
  const src=aEra==='all'?books:books.filter(b=>b.era===aEra);
  const series=[...new Set(src.map(b=>b.ser))].sort();
  sel.innerHTML='<option value="">All series</option>'+series.map(s=>`<option value="${s}"${s===cur?' selected':''}>${s}</option>`).join('');
}

function setEra(e){aEra=e;fSer='';document.getElementById('fsr').value='';buildTabs();popSeries();renderContent();}
function resetAll(){aEra='all';fSer='';fSt='';fQ='';document.getElementById('fsr').value='';document.getElementById('fst').value='';document.getElementById('q').value='';buildTabs();popSeries();renderContent();}

function getFiltered(){
  return books.filter(b=>{
    if(aEra!=='all'&&b.era!==aEra)return false;
    if(fSer&&b.ser!==fSer)return false;
    if(fSt&&gs(b.id)!==fSt)return false;
    if(fQ&&!b.t.toLowerCase().includes(fQ.toLowerCase())&&!(b.auth||'').toLowerCase().includes(fQ.toLowerCase()))return false;
    return true;
  });
}

function icon(st){
  if(st==='read')return`<svg width="10"height="10"viewBox="0 0 10 10"><polyline points="1.5,5 3.8,7.5 8.5,2.5" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if(st==='reading')return`<svg width="10"height="10"viewBox="0 0 10 10"><circle cx="5"cy="5"r="3"fill="white"/></svg>`;
  return`<span style="width:5px;height:5px;border-radius:50%;background:var(--tx2);display:inline-block;"></span>`;
}

const TYPE_CLS={novel:'bn',anthology:'ba',novella:'bv',audio:'bad',short:'bs',omnibus:'bo',saga:'bsg'};
const TYPE_LBL={novel:'Novel',anthology:'Antho',novella:'Novella',audio:'Audio',short:'Short',omnibus:'Omnibus',saga:'Saga'};

function renderContent(){
  updateProg();
  const filtered=getFiltered();
  const mc=document.getElementById('mc');
  if(!filtered.length){mc.innerHTML='<div class="empty">No books match your filters.</div>';return;}
  const erasToShow=aEra==='all'?ERAS.map(e=>e.id):[aEra];
  let html='';
  for(const eraId of erasToShow){
    const eraBooks=filtered.filter(b=>b.era===eraId);
    if(!eraBooks.length)continue;
    const eraDef=ERAS.find(e=>e.id===eraId);
    const allInEra=books.filter(b=>b.era===eraId).length;
    const readInEra=books.filter(b=>b.era===eraId&&gs(b.id)==='read').length;
    const pct=allInEra?Math.round(readInEra/allInEra*100):0;
    const serList=[...new Set(eraBooks.map(b=>b.ser))];
    html+=`<div class="esec"><div class="ehdr"><span class="etit">${eraDef.name}</span><div class="epb"><div class="epf" style="width:${pct}%"></div></div><span class="epct">${pct}%</span><span class="ecnt">${eraBooks.length}</span></div>`;
    for(const ser of serList){
      const sb=eraBooks.filter(b=>b.ser===ser).sort((a,b)=>a.o-b.o);
      html+=`<div class="sgrp"><div class="stit">${ser}</div><div class="bks">`;
      for(const bk of sb){
        const st=gs(bk.id);
        const cls=`bk s${st==='read'?'r':st==='reading'?'g':''}`;
        const ind=st!=='unread'?`<span class="sind si-${st==='read'?'r':'g'}">${st==='read'?'Read':'Reading'}</span>`:'';
        const authSpan=bk.auth?`<span style="font-size:9px;color:var(--tx2);flex-shrink:0;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${bk.auth}</span>`:'';
        html+=`<div class="${cls}" onclick="cycle(${bk.id})">
          <span class="bnum">${bk.o}</span>
          <button class="sbtn" title="Cycle: Unread → Reading → Read">${icon(st)}</button>
          <span class="btit">${bk.t}</span>
          ${authSpan}
          <span class="badge ${TYPE_CLS[bk.tp]||'bn'}">${TYPE_LBL[bk.tp]||'Novel'}</span>
          ${ind}
        </div>`;
      }
      html+=`</div></div>`;
    }
    html+=`</div>`;
  }
  mc.innerHTML=html;
}

function render(){updateProg();renderContent();}
document.getElementById('fsr').addEventListener('change',e=>{fSer=e.target.value;renderContent();});
document.getElementById('fst').addEventListener('change',e=>{fSt=e.target.value;renderContent();});
document.getElementById('q').addEventListener('input',e=>{fQ=e.target.value;renderContent();});
buildTabs();popSeries();render();
</script>
