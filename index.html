
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-dark: #8a6a1e;
    --gold-light: #f0d080;
    --red: #8b1a1a;
    --red-light: #c0392b;
    --bg-primary: #0d0d0d;
    --bg-secondary: #151515;
    --bg-card: #1a1a1a;
    --bg-card2: #1f1f1f;
    --border: rgba(201,168,76,0.2);
    --border-strong: rgba(201,168,76,0.5);
    --text-primary: #e8e0cc;
    --text-secondary: #9a9080;
    --text-muted: #5a5040;
    --read: #2e7d32;
    --read-bg: rgba(46,125,50,0.15);
    --reading: #c07820;
    --reading-bg: rgba(192,120,32,0.15);
    --unread: #3a3530;
    --unread-bg: rgba(30,28,24,0.5);
    --radius: 6px;
    --radius-lg: 10px;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg-primary: #f5f0e8;
      --bg-secondary: #ece6d8;
      --bg-card: #faf6ee;
      --bg-card2: #f0ead8;
      --border: rgba(120,80,10,0.18);
      --border-strong: rgba(120,80,10,0.4);
      --text-primary: #1a1208;
      --text-secondary: #6b5530;
      --text-muted: #a08060;
      --read: #1b5e20;
      --read-bg: rgba(46,125,50,0.1);
      --reading: #7a4a00;
      --reading-bg: rgba(192,120,32,0.1);
      --unread: #c0b8a8;
      --unread-bg: rgba(180,160,120,0.15);
      --gold: #8a5a10;
      --gold-dark: #5a3a00;
      --gold-light: #b07830;
    }
  }

  body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
  }

  .app-header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-strong);
    padding: 20px 20px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .aquila-icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
  }

  .app-title {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.05em;
    line-height: 1.2;
  }

  .app-subtitle {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .progress-section { margin-bottom: 12px; }

  .progress-stats {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .progress-label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.08em;
  }

  .progress-numbers {
    font-size: 12px;
    color: var(--text-secondary);
  }

  .progress-numbers strong { color: var(--gold); font-weight: 600; }

  .progress-bar-bg {
    height: 6px;
    background: var(--bg-card);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--read) 0%, #4caf50 100%);
    border-radius: 3px;
    transition: width 0.4s ease;
    position: relative;
  }

  .progress-bar-reading {
    height: 100%;
    background: var(--reading);
    border-radius: 3px;
    transition: width 0.4s ease;
    position: absolute;
    right: 0;
    top: 0;
  }

  .mini-stats {
    display: flex;
    gap: 12px;
    margin-top: 8px;
  }

  .mini-stat {
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--text-secondary);
  }

  .mini-stat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot-read { background: #4caf50; }
  .dot-reading { background: #f0a030; }
  .dot-unread { background: var(--text-muted); }

  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 12px 20px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
  }

  .filter-select {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 12px;
    background: var(--bg-secondary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 10px;
    cursor: pointer;
    outline: none;
    flex: 1;
    min-width: 130px;
  }

  .filter-select:focus { border-color: var(--gold); }

  .search-box {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 12px;
    background: var(--bg-secondary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 10px;
    outline: none;
    flex: 2;
    min-width: 160px;
  }

  .search-box::placeholder { color: var(--text-muted); }
  .search-box:focus { border-color: var(--gold); }

  .reset-btn {
    font-size: 11px;
    font-family: 'Source Sans 3', sans-serif;
    background: none;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 10px;
    cursor: pointer;
    white-space: nowrap;
  }

  .reset-btn:hover { color: var(--gold); border-color: var(--border-strong); }

  .content { padding: 16px 20px; }

  .era-section { margin-bottom: 28px; }

  .era-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }

  .era-header:hover .era-title { color: var(--gold-light); }

  .era-title {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.04em;
    flex: 1;
  }

  .era-count {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg-card2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2px 8px;
  }

  .era-progress-bar {
    height: 3px;
    background: var(--bg-card2);
    border-radius: 2px;
    overflow: hidden;
    width: 60px;
    flex-shrink: 0;
  }

  .era-progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 2px;
  }

  .era-pct {
    font-size: 10px;
    color: var(--text-muted);
    min-width: 28px;
    text-align: right;
  }

  .collapse-btn {
    font-size: 12px;
    color: var(--text-muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px;
    line-height: 1;
  }

  .series-group { margin-bottom: 16px; }

  .series-title {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding-left: 4px;
    border-left: 2px solid var(--border-strong);
    padding-left: 8px;
  }

  .books-list { display: flex; flex-direction: column; gap: 3px; }

  .book-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: var(--bg-card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    min-height: 44px;
  }

  .book-item:hover { border-color: var(--border-strong); background: var(--bg-card2); }

  .book-num {
    font-size: 10px;
    color: var(--text-muted);
    min-width: 24px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .book-status-btn {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    background: none;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    padding: 0;
  }

  .book-status-btn:hover { transform: scale(1.15); }

  .status-read .book-status-btn {
    background: var(--read);
    border-color: var(--read);
  }

  .status-reading .book-status-btn {
    background: var(--reading);
    border-color: var(--reading);
  }

  .book-title {
    flex: 1;
    font-size: 13px;
    color: var(--text-primary);
    line-height: 1.3;
  }

  .status-read .book-title { color: var(--text-secondary); }
  .status-reading .book-title { color: var(--text-primary); font-weight: 600; }

  .book-type-badge {
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
    flex-shrink: 0;
    border: 1px solid;
  }

  .type-novel { background: rgba(30,60,120,0.2); color: #6090e0; border-color: rgba(60,100,200,0.3); }
  .type-anthology { background: rgba(80,30,80,0.2); color: #b060c0; border-color: rgba(140,50,140,0.3); }
  .type-short { background: rgba(20,80,60,0.2); color: #50b090; border-color: rgba(30,120,90,0.3); }
  .type-omnibus { background: rgba(100,60,20,0.2); color: #c09050; border-color: rgba(160,100,30,0.3); }

  @media (prefers-color-scheme: light) {
    .type-novel { background: rgba(30,60,180,0.08); color: #1840a0; border-color: rgba(30,60,180,0.25); }
    .type-anthology { background: rgba(100,20,120,0.08); color: #701090; border-color: rgba(100,20,120,0.25); }
    .type-short { background: rgba(10,100,60,0.08); color: #0a6040; border-color: rgba(10,100,60,0.25); }
    .type-omnibus { background: rgba(120,70,10,0.08); color: #7a4800; border-color: rgba(120,70,10,0.25); }
  }

  .status-indicator {
    font-size: 9px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
    flex-shrink: 0;
    border: 1px solid;
  }

  .ind-read { background: var(--read-bg); color: #66bb6a; border-color: rgba(46,125,50,0.3); }
  .ind-reading { background: var(--reading-bg); color: #ffa040; border-color: rgba(192,120,32,0.3); }
  .ind-unread { background: transparent; color: var(--text-muted); border-color: var(--border); display: none; }

  .status-read .ind-read { display: block; }
  .status-reading .ind-reading { display: block; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .empty-state .icon { font-size: 32px; margin-bottom: 12px; }

  .check-svg { display: none; }
  .status-read .check-svg { display: block; }
  .book-dot { display: block; }
  .status-read .book-dot { display: none; }
  .status-reading .book-dot { display: none; }
  .reading-svg { display: none; }
  .status-reading .reading-svg { display: block; }
  .status-reading .book-dot { display: none; }

  .tooltip {
    position: fixed;
    background: var(--bg-secondary);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 6px 10px;
    font-size: 11px;
    color: var(--text-secondary);
    pointer-events: none;
    z-index: 1000;
    white-space: nowrap;
    display: none;
  }

  .tab-row {
    display: flex;
    overflow-x: auto;
    gap: 4px;
    padding: 10px 20px 0;
    background: var(--bg-secondary);
    scrollbar-width: none;
  }

  .tab-row::-webkit-scrollbar { display: none; }

  .era-tab {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: var(--radius) var(--radius) 0 0;
    background: none;
    border: 1px solid transparent;
    border-bottom: none;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }

  .era-tab.active {
    background: var(--bg-card);
    border-color: var(--border);
    color: var(--gold);
  }

  .era-tab:hover:not(.active) { color: var(--text-secondary); }
</style>
</head>

<div class="tooltip" id="tooltip"></div>

<div class="app-header">

</div>

<div class="tab-row" id="era-tabs"></div>

  <button class="reset-btn" onclick="resetFilters()">Reset</button>
</div>

<div class="content" id="main-content"></div>

// Assign IDs
const books = BOOKS_DATA.map((b, i) => ({ ...b, id: i }));

// Load state
let state = JSON.parse(localStorage.getItem('wh40k_tracker') || '{}');
let activeEra = 'all';
let filterSeries = '';
let filterStatus = '';
let searchQuery = '';

function getStatus(id) { return state[id] || 'unread'; }
function cycleStatus(id) {
  const s = getStatus(id);
  const next = s === 'unread' ? 'reading' : s === 'reading' ? 'read' : 'unread';
  state[id] = next;
  try { localStorage.setItem('wh40k_tracker', JSON.stringify(state)); } catch(e){}
  render();
}

function getFilteredBooks() {
  return books.filter(b => {
    if (activeEra !== 'all' && b.era !== activeEra) return false;
    if (filterSeries && b.series !== filterSeries) return false;
    if (filterStatus && getStatus(b.id) !== filterStatus) return false;
    if (searchQuery && !b.title.toLowerCase().includes(searchQuery.toLowerCase())) return false;
    return true;
  });
}

function updateProgress() {
  const total = books.length;
  const read = books.filter(b => getStatus(b.id) === 'read').length;
  const reading = books.filter(b => getStatus(b.id) === 'reading').length;
  const unread = total - read - reading;
  const pct = total ? Math.round(read / total * 100) : 0;
  document.getElementById('total-books').textContent = total;
  document.getElementById('overall-pct-text').innerHTML = `${read} of <strong id="total-books">${total}</strong> books`;
  document.getElementById('overall-bar').style.width = pct + '%';
  document.getElementById('count-read').textContent = read + ' read';
  document.getElementById('count-reading').textContent = reading + ' reading';
  document.getElementById('count-unread').textContent = unread + ' unread';
}

function populateSeriesFilter() {
  const sel = document.getElementById('filter-series');
  const currentVal = sel.value;
  const srcBooks = activeEra === 'all' ? books : books.filter(b => b.era === activeEra);
  const series = [...new Set(srcBooks.map(b => b.series))].sort();
  sel.innerHTML = '<option value="">All series</option>' + series.map(s => `<option value="${s}" ${s===currentVal?'selected':''}>${s}</option>`).join('');
}

function buildEraTabs() {
  const container = document.getElementById('era-tabs');
  const tabs = [{ id:'all', short:'All Eras' }, ...ERAS];
  container.innerHTML = tabs.map(e =>
    `<button class="era-tab ${e.id === activeEra ? 'active' : ''}" onclick="setEra('${e.id}')">${e.short}</button>`
  ).join('');
}

function setEra(eraId) {
  activeEra = eraId;
  filterSeries = '';
  document.getElementById('filter-series').value = '';
  buildEraTabs();
  populateSeriesFilter();
  renderContent();
}

function resetFilters() {
  activeEra = 'all';
  filterSeries = '';
  filterStatus = '';
  searchQuery = '';
  document.getElementById('filter-series').value = '';
  document.getElementById('filter-status').value = '';
  document.getElementById('search').value = '';
  buildEraTabs();
  populateSeriesFilter();
  renderContent();
}

function renderContent() {
  updateProgress();
  const filtered = getFilteredBooks();
  const content = document.getElementById('main-content');

  if (filtered.length === 0) {
    content.innerHTML = '<div class="empty-state"><div class="icon">📖</div><div>No books match your filters.<br><span style="font-size:12px;color:var(--text-muted)">The Librarium holds no records matching your query.</span></div></div>';
    return;
  }

  // Group by era then series
  const erasToShow = activeEra === 'all' ? ERAS.map(e => e.id) : [activeEra];
  let html = '';

  for (const eraId of erasToShow) {
    const eraBooks = filtered.filter(b => b.era === eraId);
    if (!eraBooks.length) continue;
    const eraDef = ERAS.find(e => e.id === eraId);
    const totalInEra = books.filter(b => b.era === eraId).length;
    const readInEra = books.filter(b => b.era === eraId && getStatus(b.id) === 'read').length;
    const pct = totalInEra ? Math.round(readInEra / totalInEra * 100) : 0;

    // Group by series
    const seriesList = [...new Set(eraBooks.map(b => b.series))];

    html += `<div class="era-section">
      <div class="era-header">
        <span class="era-title">${eraDef.name}</span>
        <div class="era-progress-bar"><div class="era-progress-fill" style="width:${pct}%"></div></div>
        <span class="era-pct">${pct}%</span>
        <span class="era-count">${eraBooks.length}</span>
      </div>`;

    for (const series of seriesList) {
      const seriesBooks = eraBooks.filter(b => b.series === series).sort((a,b) => a.order - b.order);
      html += `<div class="series-group">
        <div class="series-title">${series}</div>
        <div class="books-list">`;
      for (const book of seriesBooks) {
        const status = getStatus(book.id);
        const typeCls = `type-${book.type === 'short story' ? 'short' : book.type}`;
        const typeLabel = book.type === 'anthology' ? 'Anthology' : book.type === 'short' ? 'Short' : book.type === 'omnibus' ? 'Omnibus' : 'Novel';
        const checkIcon = status === 'read'
          ? `<svg width="10" height="10" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`
          : status === 'reading'
          ? `<svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3" fill="white"/></svg>`
          : `<span style="width:6px;height:6px;border-radius:50%;background:var(--text-muted);display:inline-block;"></span>`;
        html += `<div class="book-item status-${status}" onclick="cycleStatus(${book.id})">
          <span class="book-num">${book.order}</span>
          <button class="book-status-btn" title="Click to cycle status">${checkIcon}</button>
          <span class="book-title">${book.title}</span>
          <span class="book-type-badge ${typeCls}">${typeLabel}</span>
          ${status !== 'unread' ? `<span class="status-indicator ind-${status}">${status === 'read' ? 'Read' : 'Reading'}</span>` : ''}
        </div>`;
      }
      html += `</div></div>`;
    }
    html += `</div>`;
  }

  content.innerHTML = html;
}

function render() {
  updateProgress();
  renderContent();
}

// Init
document.getElementById('filter-series').addEventListener('change', e => {
  filterSeries = e.target.value;
  renderContent();
});
document.getElementById('filter-status').addEventListener('change', e => {
  filterStatus = e.target.value;
  renderContent();
});
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderContent();
});

buildEraTabs();
populateSeriesFilter();
render();
</script>
</body>
</html>
